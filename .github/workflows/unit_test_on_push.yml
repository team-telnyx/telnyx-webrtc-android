## 1
name: Unit test on Push or PR into Main

## Actions that will be executed when you push or create a pull request to main
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

## 2
jobs:
  # 3 Unit Test Script
  unit_tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: set up JDK 1.8
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Restore google-services.json from templates
        run: |
          for app in compose_app xml_app connection_service_app; do
            if [ ! -f "samples/$app/google-services.json" ] && [ -f "samples/$app/google-services.json.template" ]; then
              cp "samples/$app/google-services.json.template" "samples/$app/google-services.json"
              echo "Restored samples/$app/google-services.json from template"
            fi
          done

      - name: Create credential-free local properties
        run: touch local.properties

      - name: Clean
        run: ./gradlew clean

      - name: Assemble app debug APK
        run: bash ./gradlew assembleDebug --stacktrace

      - name: Unit tests
        run: ./gradlew test
